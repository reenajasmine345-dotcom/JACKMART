<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jack Mart - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            JACK <span>MART</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="#">Categories</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="cart.html">🛒 Cart</a>
        </nav>

    </header>


    <!-- LOGIN SECTION -->

    <section class="login-section">

        <div class="login-container">

            <h2>Welcome Back</h2>

            <p class="login-text">
                Login to your Jack Mart account
            </p>


            <form>

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="register-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <div class="footer-content">

            <h2>JACK MART</h2>

            <p>Your Complete Sports Marketplace</p>

            <p>© 2026 Jack Mart. All Rights Reserved.</p>

        </div>

    </footer>


</body>

</html>
